# Αυτόματη ενημέρωση σε κάθε αλλαγή στο main:
#  1) βάση δεδομένων + functions στο Supabase
#  2) η εφαρμογή στο GitHub Pages
# Τα κλειδιά διαβάζονται ΜΟΝΟ από τα GitHub Secrets (Settings → Secrets and variables → Actions).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  supabase:
    name: Supabase (βάση & functions)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Κοινός κώδικας για τις functions
        run: node web/build.mjs
      - name: Καθαρισμός κενών από τα κλειδιά
        env:
          K1: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          K2: ${{ secrets.SUPABASE_DB_PASSWORD }}
          K3: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for v in "SUPABASE_ACCESS_TOKEN:$K1" "SUPABASE_DB_PASSWORD:$K2" "PROJECT_REF:$K3"; do
            n=${v%%:*}; t=$(printf '%s' "${v#*:}" | tr -d '[:space:]')
            echo "::add-mask::$t"; echo "$n=$t" >> "$GITHUB_ENV"
          done
          t=$(printf '%s' "$K1" | tr -d '[:space:]'); echo "token: μήκος ${#t}, μορφή $( [[ $t =~ ^sbp_[a-f0-9]{40}$ ]] && echo κανονική || echo νέα/άγνωστη )"
          [[ $t =~ ^sbp_[a-f0-9]{40}$ ]] || echo "::warning title=token::Το SUPABASE_ACCESS_TOKEN έχει μήκος ${#t} — το εργαλείο θέλει sbp_ + 40 χαρακτήρες"
      - uses: supabase/setup-cli@v1
        with:
          # σταθερή έκδοση: δεν χρειάζεται αναζήτηση «τελευταίας» (αποφεύγει το όριο αιτημάτων του GitHub)
          version: 3.3.0
      - name: Σύνδεση με το project
        run: .github/scripts/step.sh supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Ενημέρωση βάσης (migrations)
        run: |
          # νεότερες εκδόσεις του Supabase CLI θέλουν ρητά το project (--linked ή --remote)
          .github/scripts/step.sh supabase db push --linked --password "$SUPABASE_DB_PASSWORD" \
            || .github/scripts/step.sh supabase db push --remote --password "$SUPABASE_DB_PASSWORD"
      - name: Κλειδιά AI & φωνής (μόνο στον server)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          ANTHROPIC_API_KEY=$(clean "$ANTHROPIC_API_KEY"); ELEVENLABS_API_KEY=$(clean "$ELEVENLABS_API_KEY"); ELEVENLABS_VOICE_ID=$(clean "$ELEVENLABS_VOICE_ID"); AI_MODEL=$(clean "$AI_MODEL")
          for t in "$ANTHROPIC_API_KEY" "$ELEVENLABS_API_KEY" "$ELEVENLABS_VOICE_ID"; do [ -n "$t" ] && echo "::add-mask::$t"; done
          args=()
          [ -n "$ANTHROPIC_API_KEY" ] && args+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY")
          [ -n "$ELEVENLABS_API_KEY" ] && args+=("ELEVENLABS_API_KEY=$ELEVENLABS_API_KEY")
          [ -n "$ELEVENLABS_VOICE_ID" ] && args+=("ELEVENLABS_VOICE_ID=$ELEVENLABS_VOICE_ID")
          [ -n "$AI_MODEL" ] && args+=("AI_MODEL=$AI_MODEL")
          if [ ${#args[@]} -gt 0 ]; then .github/scripts/step.sh supabase secrets set --yes --project-ref "$PROJECT_REF" "${args[@]}"; fi
      - name: Functions
        run: .github/scripts/step.sh supabase functions deploy --yes --project-ref "$PROJECT_REF"

  web:
    name: Εφαρμογή (κατασκευή)
    needs: supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Κατασκευή
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: SUPABASE_URL="https://$(printf '%s' "$REF" | tr -d '[:space:]').supabase.co" node web/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  pages:
    name: Εφαρμογή (GitHub Pages)
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  check:
    name: Έλεγχος λειτουργίας
    needs: pages
    runs-on: ubuntu-latest
    env:
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ANON: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Server, σύνδεση χρηστών, εφαρμογή
        run: |
          REF=$(printf '%s' "$REF" | tr -d '[:space:]'); ANON=$(printf '%s' "$ANON" | tr -d '[:space:]'); echo "::add-mask::$ANON"
          B="https://$REF.supabase.co"; fail=0
          c=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $ANON" "$B/auth/v1/settings"); echo "Auth: $c"; [ "$c" = 200 ] || { echo "::error title=Σύνδεση χρηστών::Auth απάντησε $c (λάθος SUPABASE_ANON_KEY;)"; fail=1; }
          s=$(curl -s -H "apikey: $ANON" "$B/auth/v1/settings"); echo "$s" | grep -q '"disable_signup":true' && echo "Δημόσιες εγγραφές: κλειστές" || echo "::warning title=Εγγραφές::Οι δημόσιες εγγραφές φαίνονται ανοιχτές"
          c=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $ANON" "$B/rest/v1/docs?select=path&limit=1"); echo "Βάση (χωρίς σύνδεση): $c"
          for f in execute admin ai tts stt; do c=$(curl -s -o /tmp/r -w '%{http_code}' -X POST -H "apikey: $ANON" -H 'Content-Type: application/json' -d '{}' "$B/functions/v1/$f"); echo "Function $f: $c $(head -c 80 /tmp/r)"; [ "$c" = 401 ] || { echo "::error title=Function $f::απάντησε $c αντί για 401"; fail=1; }; done
          u="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"; sleep 20
          c=$(curl -sL -o /tmp/i -w '%{http_code}' "$u"); echo "Εφαρμογή $u: $c"; [ "$c" = 200 ] || { echo "::error title=Εφαρμογή::$u απάντησε $c"; fail=1; }
          c=$(curl -sL "${u}config.js"); echo "$c" | grep -q "$REF.supabase.co" && echo "config.js: σωστό" || { echo "::error title=config.js::δεν περιέχει τη διεύθυνση του Supabase"; fail=1; }
          [ $fail = 0 ] && echo "::notice title=ΟΛΑ ΟΚ::Server, σύνδεση και εφαρμογή λειτουργούν"
          exit $fail
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ElevenLabs (φωνή & μικρόφωνο)
        env:
          EK: ${{ secrets.ELEVENLABS_API_KEY }}
          EV: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          EK=$(printf '%s' "$EK" | tr -d '[:space:]'); EV=$(printf '%s' "$EV" | tr -d '[:space:]'); echo "::add-mask::$EK"
          [ -z "$EK" ] && { echo "::warning title=ElevenLabs::Δεν υπάρχει ELEVENLABS_API_KEY"; exit 0; }
          echo "Μήκος κλειδιού: ${#EK}, αρχή: ${EK:0:3}…"
          # ομιλία (λίγοι χαρακτήρες)
          c=$(curl -s -o /tmp/t -w '%{http_code}' -X POST "https://api.elevenlabs.io/v1/text-to-speech/$EV?output_format=mp3_22050_32" -H "xi-api-key: $EK" -H 'Content-Type: application/json' -d '{"text":"Γεια.","model_id":"eleven_multilingual_v2"}')
          if [ "$c" = 200 ]; then echo "::notice title=Φωνή (TTS)::ΟΚ"; else echo "::error title=Φωνή (TTS) $c::$(head -c 300 /tmp/t)"; fi
          # μικρόφωνο: 1 δευτερόλεπτο σιωπής
          python3 -c "import wave;w=wave.open('/tmp/s.wav','wb');w.setnchannels(1);w.setsampwidth(2);w.setframerate(16000);w.writeframes(b'\0\0'*16000);w.close()"
          c=$(curl -s -o /tmp/s -w '%{http_code}' -X POST https://api.elevenlabs.io/v1/speech-to-text -H "xi-api-key: $EK" -F model_id=scribe_v2 -F file=@/tmp/s.wav)
          if [ "$c" = 200 ]; then echo "::notice title=Μικρόφωνο (STT)::ΟΚ"; else echo "::error title=Μικρόφωνο (STT) $c::$(head -c 300 /tmp/s)"; fi
          # ταχύτητα: ίδια πρόταση σε 0,7 και 1,2 — η αργή πρέπει να βγαίνει αισθητά μεγαλύτερη (σε διάρκεια/μέγεθος)
          T='{"text":"Στην αποθήκη Τατοΐου έχουμε σαράντα πέντε τεμάχια και στο αμάξι έξι.","model_id":"eleven_multilingual_v2","voice_settings":{"stability":0.7,"similarity_boost":0.75,"speed":SPD}}'
          for v in 0.7 1.0 1.2; do curl -s -o /tmp/sp$v.mp3 -X POST "https://api.elevenlabs.io/v1/text-to-speech/$EV?output_format=mp3_44100_128" -H "xi-api-key: $EK" -H 'Content-Type: application/json' -d "${T/SPD/$v}"; done
          a=$(stat -c%s /tmp/sp0.7.mp3); n=$(stat -c%s /tmp/sp1.0.mp3); f=$(stat -c%s /tmp/sp1.2.mp3)
          echo "::notice title=Ταχύτητα φωνής::0,7 → $a bytes · 1,0 → $n bytes · 1,2 → $f bytes"
          # όρια λεξιλογίου ζωντανής καταγραφής (για ρύθμιση της εφαρμογής)
          EK="$EK" node tests/ci/stt_probe.mjs | while read -r l; do echo "::notice title=Λεξιλόγιο STT::$l"; done
          # ζωντανή καταγραφή: κλειδί μιας χρήσης
          c=$(curl -s -o /tmp/k -w '%{http_code}' -X POST "https://api.elevenlabs.io/v1/single-use-token/realtime_scribe?max_session_duration_seconds=10" -H "xi-api-key: $EK")
          if [ "$c" = 200 ] && grep -q '"token"' /tmp/k; then echo "::notice title=Ζωντανή καταγραφή::ΟΚ"
            # σύνδεση όπως η εφαρμογή (ελληνικά, λεξιλόγιο, χωρίς «εεε») — πρέπει να ανοίξει συνεδρία χωρίς σφάλμα
            TOK=$(python3 -c "import json;print(json.load(open('/tmp/k'))['token'])")
            TOK="$TOK" node -e '
              const q = new URLSearchParams({ model_id: "scribe_v2_realtime", token: process.env.TOK, audio_format: "pcm_16000", commit_strategy: "vad", language_code: "el", no_verbatim: "true" }); q.append("secondary_languages", "en");
              ["ΤΑΤΟΙΟΥ 45", "MEGA GYM Γλυφάδα", "INOX ΛΑΜΑΡΙΝΕΣ", "ZS-C2", "γράψε"].forEach(t => q.append("keyterms", t));
              const ws = new WebSocket("wss://api.elevenlabs.io/v1/speech-to-text/realtime?" + q); let ok = false;
              const done = (m, c) => { console.log(m); process.exit(c); };
              setTimeout(() => done(ok ? "::notice title=Ζωντανή καταγραφή (λεξιλόγιο)::ΟΚ" : "::warning title=Ζωντανή καταγραφή (λεξιλόγιο)::καμία απάντηση", 0), 8000);
              ws.onmessage = e => { const m = JSON.parse(e.data); if (m.message_type === "session_started") { ok = true; ws.send(JSON.stringify({ message_type: "input_audio_chunk", audio_base_64: Buffer.alloc(3200).toString("base64"), commit: false, sample_rate: 16000, previous_text: "δοκιμή" })); setTimeout(() => done("::notice title=Ζωντανή καταγραφή (λεξιλόγιο)::ΟΚ", 0), 1500); }
                else if (m.error || /error/.test(m.message_type || "")) done("::warning title=Ζωντανή καταγραφή (λεξιλόγιο)::" + JSON.stringify(m).slice(0, 250), 0); };
              ws.onerror = () => done("::warning title=Ζωντανή καταγραφή (λεξιλόγιο)::σφάλμα σύνδεσης", 0);'
          else echo "::warning title=Ζωντανή καταγραφή $c::$(head -c 300 /tmp/k) — η εφαρμογή θα χρησιμοποιεί ηχογράφηση και μετατροπή στο τέλος"; fi
